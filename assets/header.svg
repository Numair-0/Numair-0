<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#07090f"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
    <clipPath id="track"><rect x="440" y="196" width="320" height="4"/></clipPath>

    <path id="p1" d="M70 50 L170 110 L260 180 L330 250"/>
    <path id="p2" d="M1150 60 L1030 120 L940 200 L870 260"/>
    <path id="p3" d="M40 140 L170 110 L250 60"/>
    <path id="p4" d="M950 70 L1030 120 L1120 200 L1060 280"/>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- Network -->
    <g fill="none" stroke="#94a3b8" stroke-opacity="0.16" stroke-width="1">
      <path d="M40 140 L170 110 M70 50 L170 110 L250 60 M170 110 L260 180 L330 250 L150 280 L90 200 L170 110 M90 200 L40 140"/>
      <path d="M1170 150 L1150 60 L1030 120 L950 70 M1030 120 L1120 200 L1170 150 M1030 120 L940 200 L870 260 M940 200 L1060 280 L1120 200"/>
    </g>
    <g fill="#cbd5e1" fill-opacity="0.4">
      <circle cx="70" cy="50" r="2.5"/><circle cx="170" cy="110" r="4"/><circle cx="90" cy="200" r="3"/>
      <circle cx="250" cy="60" r="2.5"/><circle cx="260" cy="180" r="3"/><circle cx="150" cy="280" r="2.5"/>
      <circle cx="330" cy="250" r="3"/><circle cx="40" cy="140" r="2.5"/>
      <circle cx="1150" cy="60" r="2.5"/><circle cx="1030" cy="120" r="4"/><circle cx="1120" cy="200" r="3"/>
      <circle cx="950" cy="70" r="2.5"/><circle cx="940" cy="200" r="3"/><circle cx="1060" cy="280" r="2.5"/>
      <circle cx="870" cy="260" r="3"/><circle cx="1170" cy="150" r="2.5"/>
    </g>
    <g>
      <circle r="3" fill="#5eead4"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
      <circle r="3" fill="#818cf8"><animateMotion dur="5s" begin="1s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
      <circle r="2.5" fill="#818cf8"><animateMotion dur="4.5s" begin="2s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
      <circle r="2.5" fill="#5eead4"><animateMotion dur="3.5s" begin="0.5s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
    </g>

    <!-- Identity -->
    <g text-anchor="middle">
      <text x="600" y="108" font-family="Consolas, Menlo, monospace" font-size="14" letter-spacing="6" fill="#5eead4">SOFTWARE ENGINEER
        <animate attributeName="opacity" values="0;1" dur="0.8s"/>
      </text>
      <text x="600" y="172" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="64" font-weight="700" fill="#f8fafc">Numair Ahmad Khan
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4;1" dur="1.3s"/>
      </text>
      <text x="600" y="242" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" fill="#94a3b8">Architecting scalable systems  ·  Integrating machine learning
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6;1" dur="1.8s"/>
      </text>
      <text x="600" y="282" font-family="Consolas, Menlo, monospace" font-size="13" letter-spacing="1" fill="#64748b">curelex.in   ·   india   ·   open to collaborate
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.7;1" dur="2.2s"/>
      </text>
    </g>

    <!-- Underline beam -->
    <rect x="440" y="197" width="320" height="1" fill="#ffffff" fill-opacity="0.08"/>
    <g clip-path="url(#track)">
      <rect x="340" y="196" width="120" height="3" rx="1.5" fill="url(#beam)">
        <animate attributeName="x" values="340;760;340" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
</svg>
